<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Мій простір"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Мій простір</title><style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#232521;--muted:#777d76;--line:#e8e8e1;--accent:#557a65;--soft:#e6eee6;--danger:#ba5750;--shadow:0 5px 24px #293a2b0a}body.dark{--bg:#151a18;--card:#222a26;--ink:#f2f5ef;--muted:#a0aaa1;--line:#354039;--accent:#a0c7a8;--soft:#344a3a;--danger:#e2938e;--shadow:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:600px;margin:auto;min-height:100dvh;padding:0 18px 104px}.header{padding:27px 0 18px;display:flex;align-items:center;justify-content:space-between}.eyebrow,.muted{color:var(--muted);font-size:12px}.header h1{font-size:26px;letter-spacing:-.8px;line-height:1.13;margin:4px 0}.round{background:var(--card);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;color:var(--ink)}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:17px;margin:0 0 13px;box-shadow:var(--shadow)}.card h2{font-size:17px;margin:0 0 12px;letter-spacing:-.25px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chip{border:0;background:var(--soft);color:var(--accent);padding:7px 12px;border-radius:30px;font-size:12px;font-weight:700}.metric{font-size:23px;font-weight:750;letter-spacing:-.6px}.small{font-size:13px;color:var(--muted)}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:650;color:white;background:var(--accent)}.btn.secondary{color:var(--ink);background:var(--soft)}.btn.ghost{background:transparent;color:var(--accent);padding:7px 3px}.entry{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}.strike{text-decoration:line-through;color:var(--muted)}.fill{flex:1;min-width:0}.tag{color:var(--muted);font-size:11px}.progress{background:var(--line);height:8px;border-radius:20px;overflow:hidden;margin:9px 0}.progress b{display:block;height:100%;background:var(--accent);border-radius:20px}.form{display:grid;gap:10px}.form label{font-size:12px;color:var(--muted)}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:12px;outline-color:var(--accent)}.form textarea{min-height:85px;resize:vertical}.fields{display:grid;gap:8px}.nav{position:fixed;z-index:4;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:9px 5px calc(9px + env(safe-area-inset-bottom));max-width:600px;margin:auto}.nav button{display:grid;justify-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:10px;padding:5px 12px}.nav button span{font-size:21px}.nav button.active{color:var(--accent);font-weight:750}.tile{border:1px solid var(--line);background:var(--card);border-radius:14px;text-align:left;padding:13px;color:var(--ink)}.tile .emoji{font-size:21px;display:block;margin-bottom:7px}.over{overflow-wrap:anywhere}.note{background:var(--soft);padding:12px;border-radius:12px;font-size:13px}.danger{color:var(--danger)!important}.link{background:none;border:0;color:var(--accent);font-weight:650;padding:4px}.rowTitle{font-weight:700}.sectionTitle{margin:25px 0 12px;font-size:18px}.pill{font-size:12px;color:var(--muted)}.back{border:0;background:transparent;color:var(--accent);padding:0 0 12px;font-weight:650}.footer{padding:18px 0;color:var(--muted);font-size:12px;text-align:center}details{padding:9px 0}summary{cursor:pointer;font-weight:650}.hscroll{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.hscroll button{white-space:nowrap}.modalOverlay{position:fixed;inset:0;background:#0007;z-index:9;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--bg);width:min(600px,100%);max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 15px}.close{border:0;background:none;color:var(--muted);font-size:23px}.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);padding:10px 14px;background:#27392f;color:#fff;border-radius:12px;z-index:11;max-width:90%;font-size:13px}.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.subtabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 11px}.subtabs .chosen{background:var(--soft);border-color:var(--accent)}@media(min-width:601px){.nav{border-radius:18px 18px 0 0}}
</style></head><body><main id="app"></main><div id="modalRoot"></div><script>
(()=>{'use strict';const KEY='miy-prostir-v1';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const seed=()=>({theme:'light',tasks:[],transactions:[],goals:[{id:id(),name:'Новорічна Європа',target:30000,saved:0}],projects:[{id:id(),name:'Канада',category:'Подорожі',notes:'',date:''},{id:id(),name:'Новорічна Європа',category:'Подорожі',notes:'',date:''},{id:id(),name:'Балакком',category:'Робота',notes:'',date:''},{id:id(),name:'Методолог',category:'Робота',notes:'',date:''}],lessons:[],books:[],lists:[],salaries:[],sections:[],daily:[],settings:{}});function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){data=seed()}const defaults=seed();for(const k of Object.keys(defaults))if(!(k in data))data[k]=defaults[k];let page='home',sub='';let currentProject='';let toastTimer;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:2}).format(Number(n)||0)+' ₴';const niceDate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${d}.${m}.${y}`};function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notify('Не вдалося зберегти. Експортуй резервну копію!')}}function update(fn){fn();save();render()}function notify(s){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2700)}const btn=(txt,act,cls='secondary')=>`<button class="btn ${cls}" data-act="${act}">${txt}</button>`;const empty=t=>`<p class="small">${t}</p>`;const entry=(title,caption,right='')=>`<div class="entry"><div class="fill"><div class="rowTitle over">${esc(title)}</div>${caption?`<div class="small">${esc(caption)}</div>`:''}</div>${right}</div>`;function header(name,desc){return `<header class="header"><div><div class="eyebrow">${esc(desc)}</div><h1>${esc(name)}</h1></div><button class="round" data-act="theme" aria-label="Змінити тему">${data.theme==='dark'?'☀️':'🌙'}</button></header>`}function home(){const done=data.tasks.filter(t=>t.date===today()&&t.done).length,day=data.tasks.filter(t=>t.date===today());const expenses=data.transactions.filter(t=>t.date===today()&&t.kind==='expense').reduce((a,t)=>a+Number(t.amount),0);return header('Мій день',new Date().toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'}))+`<div class="card"><div class="flex"><h2>Плани на сьогодні</h2><span class="chip">${done}/${day.length} виконано</span></div>${day.length?day.map(t=>taskRow(t)).join(''):empty('Поки немає планів. Додай перший — навіть маленький.')}${btn('＋ Додати план','task')}</div><div class="two"><div class="card"><div class="small">Витрати сьогодні</div><div class="metric">${money(expenses)}</div></div><div class="card"><div class="small">Виконані справи</div><div class="metric">${done} / ${day.length}</div></div></div><div class="card"><h2>Швидкі дії</h2><div class="two"><button class="tile" data-act="expense"><span class="emoji">💸</span>Додати витрату</button><button class="tile" data-act="newlist"><span class="emoji">🧺</span>Список покупок</button><button class="tile" data-act="income"><span class="emoji">💰</span>Додати дохід</button><button class="tile" data-act="task"><span class="emoji">✅</span>Нове завдання</button></div></div><div class="card"><h2>Мої напрямки</h2><div class="two">${[['💰','Фінанси','finance'],['🧳','Подорожі','travel'],['💼','Робота','work'],['📘','Англійська','english'],['📚','Книги','books'],['🧘','Активність','activity']].map(x=>`<button class="tile" data-page="${x[2]}"><span class="emoji">${x[0]}</span>${x[1]}</button>`).join('')}</div></div>`}function taskRow(t){return `<div class="entry"><input type="checkbox" data-checktask="${t.id}" ${t.done?'checked':''}><div class="fill"><div class="${t.done?'strike':''}">${esc(t.title)}</div><div class="tag">${esc(t.category||'Особисте')} · ${niceDate(t.date)}</div></div><button class="link danger" data-del="tasks:${t.id}" aria-label="Видалити">×</button></div>`}
function finances(){let inc=data.transactions.filter(x=>x.kind==='income').reduce((a,x)=>a+Number(x.amount),0),out=data.transactions.filter(x=>x.kind==='expense').reduce((a,x)=>a+Number(x.amount),0);return header('Фінанси','Доходи, витрати та цілі')+`<div class="two"><div class="card"><div class="small">Доходи</div><div class="metric">${money(inc)}</div></div><div class="card"><div class="small">Витрати</div><div class="metric">${money(out)}</div></div></div><div class="card"><div class="flex"><h2>Мої цілі · баночки</h2><button class="link" data-act="goal">＋ Додати</button></div>${data.goals.map(g=>`<div class="entry"><div class="fill"><b>${esc(g.name)}</b><div class="small">${money(g.saved)} із ${money(g.target)}</div><div class="progress"><b style="width:${Math.min(100,100*(+g.saved||0)/(+g.target||1))}%"></b></div></div><button class="chip" data-act="savegoal:${g.id}">＋ кошти</button><button class="link danger" data-del="goals:${g.id}">×</button></div>`).join('')||empty('Ще немає цілей.')}</div><div class="card"><div class="flex"><h2>Операції</h2><div>${btn('＋ Дохід','income','ghost')} ${btn('＋ Витрата','expense','ghost')}</div></div>${[...data.transactions].reverse().slice(0,40).map(t=>entry((t.kind==='income'?'↗ ':'↘ ')+(t.title||t.category),[niceDate(t.date),t.project,t.category].filter(Boolean).join(' · '),`<b style="color:${t.kind==='income'?'var(--accent)':'var(--ink)'}">${t.kind==='income'?'+':'−'}${money(t.amount)}</b><button class="link danger" data-del="transactions:${t.id}">×</button>`)).join('')||empty('Тут з’являться твої доходи та витрати.')}</div>`}function projectCard(p){const ex=data.transactions.filter(t=>t.project===p.name&&t.kind==='expense').reduce((s,t)=>s+Number(t.amount),0);return `<button class="tile" data-openproject="${p.id}"><span class="emoji">${p.category==='Робота'?'💼':'🧳'}</span><b>${esc(p.name)}</b><div class="small">Витрати: ${money(ex)}</div></button>`}function projects(cat){let p=data.projects.filter(x=>x.category===cat);return header(cat,cat==='Робота'?'Робочі проєкти, зарплата та записи':'Мої мандрівки та плани')+`<div class="card"><div class="flex"><h2>Мої проєкти</h2><button class="link" data-act="project:${cat}">＋ Додати</button></div><div class="two">${p.map(projectCard).join('')}</div></div>${cat==='Робота'?`<div class="card"><div class="flex"><h2>Зарплата</h2><button class="link" data-act="salary">＋ Записати</button></div><div class="note">Фактично отримана зарплата автоматично потрапляє у Фінанси → Доходи. Нарахована, але ще не отримана — ні.</div>${[...data.salaries].reverse().map(s=>entry(`${s.work} · ${s.month}`,`Нараховано: ${money(s.accrued)} · Отримано: ${money(s.received)}`,`<button class="link danger" data-del="salaries:${s.id}">×</button>`)).join('')||empty('Зарплата ще не записана.')}</div>`:''}`}
function projectDetail(){const p=data.projects.find(x=>x.id===currentProject);if(!p){currentProject='';return projects('Подорожі')}const ts=data.tasks.filter(t=>t.project===p.name);const ex=data.transactions.filter(t=>t.project===p.name&&t.kind==='expense');const total=ex.reduce((a,x)=>a+Number(x.amount),0);return `<div class="header"><div><button class="back" data-page="${p.category==='Робота'?'work':'travel'}">← ${p.category}</button><h1>${esc(p.name)}</h1></div><button class="round" data-act="theme">◐</button></div><div class="card"><div class="flex"><h2>Мої записи</h2><button class="link" data-act="editproject:${p.id}">Редагувати</button></div><div class="small">${esc(p.date?niceDate(p.date):'Без встановленої дати')}</div><div class="over" style="white-space:pre-wrap;margin-top:10px">${esc(p.notes||'Тут можна зберігати всі ідеї, посилання, контакти й подробиці.')}</div></div><div class="card"><div class="flex"><h2>Справи проєкту</h2><button class="link" data-act="taskproject:${p.id}">＋ Додати</button></div>${ts.map(taskRow).join('')||empty('Справ поки немає.')}</div><div class="card"><div class="flex"><h2>Витрати · ${money(total)}</h2><button class="link" data-act="expenseproject:${p.id}">＋ Додати</button></div>${ex.map(t=>entry(t.title||t.category,niceDate(t.date),money(t.amount))).join('')||empty('Витрат у цьому проєкті ще не було.')}</div>`}
function english(){return header('Англійська','Уроки, прогрес і матеріали')+`<div class="card"><div class="flex"><h2>Мої уроки</h2><button class="link" data-act="lesson">＋ Урок</button></div>${[...data.lessons].reverse().map(l=>entry(l.title,`${niceDate(l.date)} · ${l.minutes||0} хв · ${l.notes||''}`,`<button class="link danger" data-del="lessons:${l.id}">×</button>`)).join('')||empty('Додай перше заняття.')}</div><div class="card"><div class="flex"><h2>Постійні нотатки</h2><button class="link" data-act="engnotes">Змінити</button></div><div class="over" style="white-space:pre-wrap">${esc(data.settings.englishNotes||'Телефон викладача, посилання, корисні записи…')}</div></div>`}function books(){return header('Мої книги','Бібліотека і враження')+`<div class="card"><div class="flex"><h2>Книжкова полиця</h2><button class="link" data-act="book">＋ Книга</button></div><div class="two">${[['Хочу прочитати','📖'],['Читаю','📘'],['Прочитано','✅']].map(([s,e])=>`<div class="note">${e} ${s}<div class="metric">${data.books.filter(b=>b.status===s).length}</div></div>`).join('')}</div>${data.books.map(b=>entry(b.title,`${b.author||'Автор не вказаний'} · ${b.status}${b.notes?' · '+b.notes:''}`,`<button class="link" data-act="bookedit:${b.id}">✎</button><button class="link danger" data-del="books:${b.id}">×</button>`)).join('')||empty('Твої книги з’являться тут.')}</div>`}function activity(){const ts=data.tasks.filter(x=>x.category==='Активність'||x.category==='Здоров’я');return header('Активність','Невеликі кроки щодня')+`<div class="card"><div class="flex"><h2>Мій рух</h2><button class="link" data-act="activity">＋ Записати</button></div><div class="note">Коли відмічаєш заняття в «Моєму дні», воно також зберігається тут.</div>${ts.map(taskRow).join('')||empty('Наприклад, йога 20 хвилин або прогулянка.')}</div>`}function shopping(){return header('Покупки','Списки, чеки та історія')+`<div class="card"><div class="flex"><h2>Списки покупок</h2><button class="link" data-act="newlist">＋ Список</button></div>${[...data.lists].reverse().map(l=>`<div class="entry"><div class="fill"><b>${esc(l.name)}</b><div class="small">${niceDate(l.date)} · ${(l.items||[]).filter(x=>x.done).length}/${(l.items||[]).length} товарів ${l.completed?'· чек '+money(l.total):''}</div></div><button class="chip" data-act="openlist:${l.id}">Відкрити</button><button class="link danger" data-del="lists:${l.id}">×</button></div>`).join('')||empty('Створи список. Дата автоматично встановиться на сьогодні.')}</div>`}function shoppingDetail(){const l=data.lists.find(x=>x.id===sub);if(!l)return shopping();return `<div class="header"><div><button class="back" data-page="shopping">← Покупки</button><h1>${esc(l.name)}</h1><div class="small">${niceDate(l.date)}</div></div></div><div class="card"><h2>Що купити</h2>${(l.items||[]).map(it=>`<div class="entry"><input type="checkbox" ${it.done?'checked':''} data-listcheck="${l.id}:${it.id}"/><span class="fill ${it.done?'strike':''}">${esc(it.name)}</span><button class="link danger" data-act="delitem:${l.id}:${it.id}">×</button></div>`).join('')||empty('У списку ще немає товарів.')}<form class="form" data-form="listitem:${l.id}"><input name="name" placeholder="Наприклад, яблука" required><button class="btn">＋ Додати товар</button></form></div>${l.completed?`<div class="card"><h2>Покупку завершено ✓</h2><div class="metric">${money(l.total)}</div><p class="small">Чек уже враховано у фінансах.</p></div>`:`<div class="card"><h2>Завершити покупку</h2><form class="form" data-form="finish:${l.id}"><label>Сума чека, ₴<input name="total" type="number" min="0" step="0.01" required placeholder="0.00"></label><button class="btn">Зберегти чек і додати витрату</button></form></div>`}`}
function more(){return header('Ще','Твої додаткові розділи й налаштування')+`<div class="card"><h2>Розділи</h2><div class="two">${[['🧺','Покупки','shopping'],['📚','Книги','books'],['🧘','Активність','activity'],['📘','Англійська','english']].map(x=>`<button class="tile" data-page="${x[2]}"><span class="emoji">${x[0]}</span>${x[1]}</button>`).join('')}</div></div><div class="card"><div class="flex"><h2>Мої власні розділи</h2><button class="link" data-act="section">＋ Додати</button></div>${data.sections.map(x=>entry(x.name,x.notes,`<button class="link" data-act="editsection:${x.id}">✎</button><button class="link danger" data-del="sections:${x.id}">×</button>`)).join('')||empty('Можна створювати власні розділи та записи.')}</div><div class="card"><h2>Мої дані</h2><p class="small">Записи автоматично зберігаються в цьому браузері. Для захисту від втрати регулярно завантажуй резервну копію. Дані ще НЕ синхронізуються між пристроями.</p><div class="stack">${btn('⬇️ Завантажити резервну копію','export')}${btn('⬆️ Відновити з копії','import','secondary')}${btn(data.theme==='dark'?'☀️ Світла тема':'🌙 Темна тема','theme','secondary')}</div></div><div class="footer">Мій простір · безкоштовна перша версія · v1</div>`}function render(){document.body.classList.toggle('dark',data.theme==='dark');const view=currentProject?'detail':page;$('#app').innerHTML=(view==='home'?home():view==='finance'?finances():view==='travel'?projects('Подорожі'):view==='work'?projects('Робота'):view==='detail'?projectDetail():view==='english'?english():view==='books'?books():view==='activity'?activity():view==='shopping'?(sub?shoppingDetail():shopping()):more())+`<nav class="nav">${[['home','⌂','Головна'],['finance','◉','Фінанси'],['travel','✈','Подорожі'],['work','▣','Робота'],['more','☷','Ще']].map(x=>`<button class="${page===x[0]&&!currentProject?'active':''}" data-page="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function modal(title,fields,form){$('#modalRoot').innerHTML=`<div class="modalOverlay"><div class="modal"><div class="flex"><h2>${esc(title)}</h2><button class="close" data-act="close">×</button></div><form class="form" data-form="${esc(form)}">${fields}<button class="btn">Зберегти</button></form></div></div>`}function field(name,label,type='text',value='',required=true){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}></label>`}function textArea(name,label,value=''){return `<label>${label}<textarea name="${name}">${esc(value)}</textarea></label>`}function select(name,label,values,chosen=''){return `<label>${label}<select name="${name}">${values.map(x=>`<option ${x===chosen?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}function act(s){if(s==='close'){$('#modalRoot').innerHTML='';return}if(s==='theme'){update(()=>data.theme=data.theme==='dark'?'light':'dark');return}if(s==='task'||s==='activity'||s.startsWith('taskproject:')){const p=s.startsWith('taskproject:')?data.projects.find(x=>x.id===s.split(':')[1]):null;modal('Нове завдання',field('title','Що плануєш?')+field('date','Дата','date',today())+select('category','Напрям',['Особисте','Активність','Здоров’я','Англійська','Робота','Подорожі'],s==='activity'?'Активність':p?.category||'Особисте')+`<input type="hidden" name="project" value="${esc(p?.name||'')}">`,'task');return}if(s==='expense'||s==='income'||s.startsWith('expenseproject:')){const p=s.startsWith('expenseproject:')?data.projects.find(x=>x.id===s.split(':')[1]):null;const kind=s==='income'?'income':'expense';modal(kind==='income'?'Додати дохід':'Додати витрату',field('title','Назва')+field('amount','Сума, ₴','number')+field('date','Дата','date',today())+select('category','Категорія',kind==='income'?['Інше','Зарплата','Подарунок']:['Інше','Продукти','Подорожі','Транспорт','Здоров’я','Навчання','Розваги'])+select('project','Пов’язаний проєкт',['— Без проєкту —',...data.projects.map(p=>p.name)],p?.name||'— Без проєкту —')+`<input type="hidden" name="kind" value="${kind}">`,'transaction');return}if(s==='goal'){modal('Нова фінансова ціль',field('name','Назва цілі')+field('target','Потрібна сума, ₴','number')+field('saved','Уже накопичено, ₴','number','0'),'goal');return}if(s.startsWith('savegoal:')){modal('Поповнити баночку',field('amount','Додати суму, ₴','number'),'savegoal:'+s.split(':')[1]);return}if(s.startsWith('project:')){modal('Новий проєкт',field('name','Назва')+field('date','Дата (за бажанням)','date','',false)+textArea('notes','Мої записи')+`<input type="hidden" name="category" value="${esc(s.split(':')[1])}">`,'project');return}if(s.startsWith('editproject:')){const p=data.projects.find(x=>x.id===s.split(':')[1]);modal('Редагувати проєкт',field('name','Назва', 'text',p.name)+field('date','Дата','date',p.date,false)+textArea('notes','Мої записи',p.notes),'editproject:'+p.id);return}if(s==='salary'){modal('Зарплата за місяць',select('work','Місце роботи',data.projects.filter(x=>x.category==='Робота').map(x=>x.name).length?data.projects.filter(x=>x.category==='Робота').map(x=>x.name):['Робота'])+field('month','Місяць','month',today().slice(0,7))+field('accrued','Нараховано, ₴','number')+field('received','Фактично отримано, ₴','number','0')+field('date','Дата надходження','date',today()),'salary');return}if(s==='lesson'){modal('Новий урок',field('title','Тема уроку')+field('date','Дата','date',today())+field('minutes','Тривалість, хв','number','60')+textArea('notes','Нотатки й наступні кроки'),'lesson');return}if(s==='engnotes'){modal('Постійні нотатки',textArea('notes','Контакти, посилання, матеріали',data.settings.englishNotes||''),'engnotes');return}if(s==='book'||s.startsWith('bookedit:')){const b=data.books.find(x=>x.id===s.split(':')[1]);modal('Моя книга',field('title','Назва', 'text',b?.title||'')+field('author','Автор','text',b?.author||'',false)+select('status','Статус',['Хочу прочитати','Читаю','Прочитано'],b?.status||'Хочу прочитати')+textArea('notes','Мої враження',b?.notes||''),'book:'+(b?.id||'new'));return}if(s==='newlist'){modal('Новий список покупок',field('name','Назва списку','text','Покупки')+field('date','Дата','date',today()),'newlist');return}if(s.startsWith('openlist:')){page='shopping';sub=s.split(':')[1];render();return}if(s.startsWith('delitem:')){let [,lid,iid]=s.split(':');update(()=>{const l=data.lists.find(x=>x.id===lid);l.items=l.items.filter(x=>x.id!==iid)});return}if(s==='section'||s.startsWith('editsection:')){const sec=data.sections.find(x=>x.id===s.split(':')[1]);modal('Власний розділ',field('name','Назва', 'text',sec?.name||'')+textArea('notes','Мої записи',sec?.notes||''),'section:'+(sec?.id||'new'));return}if(s==='export'){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='miy-prostir-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);notify('Резервну копію підготовлено. Збережи файл у «Файли».');return}if(s==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{const x=JSON.parse(await inp.files[0].text());if(!x.data||!Array.isArray(x.data.tasks)||!Array.isArray(x.data.transactions))throw Error();if(!confirm('Відновити дані з копії? Поточні записи будуть замінені.'))return;data={...seed(),...x.data};save();render();notify('Дані відновлено')}catch{notify('Файл резервної копії не підходить')}};inp.click()}}
function handleForm(e){e.preventDefault();const f=e.target,form=f.dataset.form,v=Object.fromEntries(new FormData(f));const num=k=>Number(v[k])||0;update(()=>{if(form==='task')data.tasks.push({id:id(),title:v.title,date:v.date,category:v.category,project:v.project||'',done:false});else if(form==='transaction')data.transactions.push({id:id(),title:v.title,amount:num('amount'),date:v.date,category:v.category,project:v.project==='— Без проєкту —'?'':v.project,kind:v.kind});else if(form==='goal')data.goals.push({id:id(),name:v.name,target:num('target'),saved:num('saved')});else if(form.startsWith('savegoal:')){const g=data.goals.find(x=>x.id===form.split(':')[1]);if(g)g.saved+=num('amount')}else if(form==='project')data.projects.push({id:id(),name:v.name,date:v.date,notes:v.notes,category:v.category});else if(form.startsWith('editproject:')){const p=data.projects.find(x=>x.id===form.split(':')[1]);if(p)Object.assign(p,{name:v.name,date:v.date,notes:v.notes})}else if(form==='salary'){const sid=id();data.salaries.push({id:sid,...v,accrued:num('accrued'),received:num('received')});if(num('received')>0)data.transactions.push({id:id(),salaryId:sid,title:'Зарплата · '+v.work+' · '+v.month,amount:num('received'),date:v.date,category:'Зарплата',kind:'income',project:v.work})}else if(form==='lesson')data.lessons.push({id:id(),...v});else if(form==='engnotes')data.settings.englishNotes=v.notes;else if(form.startsWith('book:')){const bid=form.split(':')[1];if(bid==='new')data.books.push({id:id(),...v});else Object.assign(data.books.find(x=>x.id===bid),v)}else if(form==='newlist')data.lists.push({id:id(),name:v.name,date:v.date,items:[],completed:false,total:0});else if(form.startsWith('listitem:')){const l=data.lists.find(x=>x.id===form.split(':')[1]);l.items.push({id:id(),name:v.name,done:false})}else if(form.startsWith('finish:')){const l=data.lists.find(x=>x.id===form.split(':')[1]);if(!l.completed){l.total=num('total');l.completed=true;if(l.total>0)data.transactions.push({id:id(),listId:l.id,kind:'expense',title:'Покупки · '+l.name,amount:l.total,date:l.date,category:'Продукти',project:''})}}else if(form.startsWith('section:')){const sid=form.split(':')[1];if(sid==='new')data.sections.push({id:id(),...v});else Object.assign(data.sections.find(x=>x.id===sid),v)}});if(!form.startsWith('listitem:'))$('#modalRoot').innerHTML='';else f.reset();notify('Збережено ✓')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-act],[data-openproject],[data-del]');if(!el)return;if(el.dataset.page){page=el.dataset.page;currentProject='';sub='';render();scrollTo(0,0)}else if(el.dataset.openproject){currentProject=el.dataset.openproject;render();scrollTo(0,0)}else if(el.dataset.act)act(el.dataset.act);else if(el.dataset.del){const [coll,xid]=el.dataset.del.split(':');if(confirm('Видалити цей запис?'))update(()=>{if(coll==='salaries'){data.transactions=data.transactions.filter(t=>t.salaryId!==xid)}if(coll==='lists'){data.transactions=data.transactions.filter(t=>t.listId!==xid)}data[coll]=data[coll].filter(x=>x.id!==xid)})}});document.addEventListener('change',e=>{if(e.target.dataset.checktask){update(()=>{let t=data.tasks.find(x=>x.id===e.target.dataset.checktask);t.done=e.target.checked})}if(e.target.dataset.listcheck){const [lid,iid]=e.target.dataset.listcheck.split(':');update(()=>{const l=data.lists.find(x=>x.id===lid);l.items.find(i=>i.id===iid).done=e.target.checked})}});document.addEventListener('submit',e=>{if(e.target.dataset.form)handleForm(e)});render();})();
</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
